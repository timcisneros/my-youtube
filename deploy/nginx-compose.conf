worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    proxy_cache_path /var/cache/nginx/thumbnails levels=1:2
        keys_zone=thumbnail_cache:32m max_size=2g inactive=7d use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $arg_v $runtime_cache_control {
        default "no-cache";
        ~^[0-9a-f]{16}$ "public, max-age=31536000, immutable";
    }

    map $http_accept_encoding $runtime_encoding_suffix {
        default "";
        ~*br ".br";
        ~*gzip ".gz";
    }

    map $runtime_encoding_suffix $runtime_content_encoding {
        default "";
        ".br" "br";
        ".gz" "gzip";
    }

    upstream app_web {
        server web:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Serve the build output without occupying an Express worker. Runtime
        # files are immutable only when their exact content hash is present.
        location /fonts/ {
            alias /srv/my-youtube/public/fonts/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        location = /sw.js {
            root /srv/my-youtube/public;
            expires -1;
            add_header Cache-Control "no-cache" always;
            access_log off;
        }

        location ~ ^/(app|native-player-engine(?:\.min)?|player-(?:page|telemetry)(?:\.min)?|idb-helpers)\.js$ {
            root /srv/my-youtube/public;
            try_files $uri$runtime_encoding_suffix $uri =404;
            gzip off;
            expires off;
            add_header Cache-Control $runtime_cache_control always;
            add_header Content-Encoding $runtime_content_encoding always;
            add_header Vary Accept-Encoding always;
            access_log off;
        }

        location = /style.css {
            root /srv/my-youtube/public;
            try_files $uri$runtime_encoding_suffix $uri =404;
            gzip off;
            expires off;
            add_header Cache-Control $runtime_cache_control always;
            add_header Content-Encoding $runtime_content_encoding always;
            add_header Vary Accept-Encoding always;
            access_log off;
        }

        location ~ ^/(manifest\.json|favicon\.svg)$ {
            root /srv/my-youtube/public;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        location = /ws/status {
            proxy_pass http://app_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        location ~ ^/api/stream/[A-Za-z0-9_-]{11}/(?:poster|thumb)$ {
            proxy_pass http://app_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache thumbnail_cache;
            proxy_cache_key $uri;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 30s;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;
            add_header X-Thumbnail-Cache $upstream_cache_status always;
        }

        location ~ ^/(?:channel/[^/]+/avatar|api/comments/avatar/.+)$ {
            proxy_pass http://app_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache thumbnail_cache;
            proxy_cache_key $request_uri;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_valid 200 24h;
            proxy_cache_valid 400 404 30s;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;
            add_header X-Thumbnail-Cache $upstream_cache_status always;
        }

        location ~ ^/api/stream/[A-Za-z0-9_-]{11}/storyboard/[0-9]+$ {
            proxy_pass http://app_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache thumbnail_cache;
            proxy_cache_key $uri;
            proxy_cache_lock on;
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 30s;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;
            add_header X-Thumbnail-Cache $upstream_cache_status always;
        }

        location ~ ^/api/stream/[A-Za-z0-9_-]{11}/status$ {
            proxy_pass http://app_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
            chunked_transfer_encoding off;
        }

        location = /api/stream/durations-live {
            proxy_pass http://app_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 45s;
            chunked_transfer_encoding off;
        }

        location ~ ^/api/stream/ {
            proxy_pass http://app_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://app_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
